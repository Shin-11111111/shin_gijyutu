<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>タイムシフトカメラ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000;
            color: #f8fafc;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .controls {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            padding: 0.75rem 1.5rem;
            border-radius: 5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 600px;
            z-index: 10;
            transition: opacity 0.3s, transform 0.3s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .controls.hidden {
            opacity: 0;
            transform: translate(-50%, 40px);
            pointer-events: none;
        }
        .status-badge {
            position: absolute;
            top: 1rem;
            left: 1.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            background: rgba(239, 68, 68, 0.8);
            color: white;
            font-weight: bold;
            font-size: 0.7rem;
            pointer-events: none;
            z-index: 5;
            letter-spacing: 0.05em;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
            width: 100%;
        }
        
        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 8px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -10px;
            background-color: #3b82f6;
            border-radius: 50%;
            height: 28px;
            width: 28px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 2px solid white;
        }

        input[type=range]::-moz-range-track {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 8px;
        }
        input[type=range]::-moz-range-thumb {
            background-color: #3b82f6;
            border-radius: 50%;
            height: 28px;
            width: 28px;
            border: 2px solid white;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        @media (max-width: 520px) {
            .controls {
                flex-wrap: wrap;
                border-radius: 1.5rem;
                padding: 0.75rem 1rem;
                gap: 0.5rem;
            }
            .controls > .flex-col {
                order: 1;
                width: 100%;
                flex-basis: 100%;
            }
            #toggleBtn { order: 2; }
            #flipBtn   { order: 3; flex: 1; }
            #cameraBtn { order: 4; flex: 1; }
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <video id="liveVideo" autoplay playsinline muted style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;"></video>
        <canvas id="outputCanvas"></canvas>
        
        <div id="status" class="status-badge">準備中…</div>

        <div class="controls" id="controls">
            <button id="toggleBtn" class="bg-blue-600 hover:bg-blue-500 w-12 h-12 rounded-full flex items-center justify-center transition shrink-0 shadow-lg">
                <span id="toggleIcon" class="text-white"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></span>
            </button>

            <div class="flex flex-col flex-grow">
                <div class="flex justify-between items-center px-1 mb-1">
                    <span class="text-[10px] text-gray-400 uppercase font-black">Delay</span>
                    <span id="delayDisplay" class="text-lg font-mono text-blue-400 font-bold">5.0s</span>
                </div>
                <input type="range" id="delayRange" min="0.5" max="30" step="0.5" value="5">
            </div>

            <button id="flipBtn" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full text-[10px] font-bold transition shrink-0 border border-white/10">
                左右反転
            </button>
            <button id="cameraBtn" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full text-[10px] font-bold transition shrink-0 border border-white/10">
                外カメ
            </button>
        </div>
    </div>

    <script>
        const liveVideo = document.getElementById('liveVideo');
        const outputCanvas = document.getElementById('outputCanvas');
        const ctx = outputCanvas.getContext('2d', { alpha: false });
        const delayRange = document.getElementById('delayRange');
        const delayDisplay = document.getElementById('delayDisplay');
        const controls = document.getElementById('controls');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        const flipBtn = document.getElementById('flipBtn');
        const cameraBtn = document.getElementById('cameraBtn');
        const statusBadge = document.getElementById('status');
        const container = document.getElementById('container');

        let buffer = [];
        let isRunning = true;
        let isFlipped = false;
        let facingMode = "environment";
        let loopId = 0;
        let isSwitching = false;
        const TARGET_FPS = 30;
        const FRAME_INTERVAL = 1000 / TARGET_FPS;
        let lastFrameTime = 0;

        async function getStream(mode) {
            const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
            try {
                return await navigator.mediaDevices.getUserMedia({
                    video: { ...size, facingMode: { exact: mode } },
                    audio: false
                });
            } catch (e) {
                if (e.name === "OverconstrainedError" || e.name === "NotFoundError") {
                    return await navigator.mediaDevices.getUserMedia({
                        video: { ...size, facingMode: { ideal: mode } },
                        audio: false
                    });
                }
                throw e;
            }
        }

        function updateCameraLabel() {
            cameraBtn.textContent = facingMode === "environment" ? "外カメ" : "内カメ";
        }

        async function initCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusBadge.textContent = "カメラが使えません";
                statusBadge.style.background = "red";
                alert("この方法ではカメラを使えません。");
                return false;
            }

            loopId++;
            const oldTracks = liveVideo.srcObject?.getTracks();
            oldTracks?.forEach(t => t.stop());
            liveVideo.srcObject = null;

            try {
                const stream = await getStream(facingMode);

                const actual = stream.getVideoTracks()[0].getSettings().facingMode;
                if (actual === "environment" || actual === "user") {
                    facingMode = actual;
                }
                updateCameraLabel();

                liveVideo.onloadedmetadata = async () => {
                    try {
                        await liveVideo.play();
                        outputCanvas.width = liveVideo.videoWidth;
                        outputCanvas.height = liveVideo.videoHeight;
                        console.log("Camera started:", liveVideo.videoWidth, "x", liveVideo.videoHeight);
                        startLoop();
                    } catch (playError) {
                        console.error("Playback failed:", playError);
                    }
                };
                liveVideo.srcObject = stream;
                return true;
            } catch (err) {
                console.error("Camera error:", err);
                statusBadge.textContent = "カメラのエラー";
                statusBadge.style.background = "red";
                if (err.name === "NotAllowedError") {
                    alert("カメラの使用が許可されていません。\nブラウザの設定で、カメラを「許可」にしてから、ページを読み込み直してください。");
                } else if (err.name === "NotFoundError") {
                    alert("カメラが見つかりません。\nカメラがついている機器か確認してください。");
                } else if (err.name === "NotReadableError") {
                    alert("カメラを他のアプリが使っています。\n他のアプリを閉じてから、もう一度試してください。");
                } else {
                    alert("カメラを起動できませんでした。\nページを読み込み直してください。");
                }
                return false;
            }
        }

        function startLoop() {
            loopId++;
            const myId = loopId;
            lastFrameTime = 0;
            requestAnimationFrame((t) => processFrame(t, myId));
        }

        function processFrame(now, myId) {
            if (!isRunning || myId !== loopId) return;

            const elapsed = now - lastFrameTime;
            if (elapsed < FRAME_INTERVAL) {
                requestAnimationFrame((t) => processFrame(t, myId));
                return;
            }
            lastFrameTime = now;

            if (liveVideo.readyState >= 2) {
                const scale = Math.min(1, 854 / liveVideo.videoWidth);
                const saveW = Math.round(liveVideo.videoWidth * scale);
                const saveH = Math.round(liveVideo.videoHeight * scale);

                createImageBitmap(liveVideo, {
                    resizeWidth: saveW,
                    resizeHeight: saveH,
                    resizeQuality: 'low'
                }).then(bitmap => {
                    if (!isRunning || myId !== loopId) {
                        bitmap.close();
                        return;
                    }
                    const timestamp = performance.now();
                    buffer.push({ img: bitmap, time: timestamp });
                    const MAX_FRAMES = 1000;
                    while (buffer.length > MAX_FRAMES) {
                        buffer.shift().img.close();
                    }
                    const delayMs = parseFloat(delayRange.value) * 1000;
                    const targetTime = timestamp - delayMs;
                    
                    while (buffer.length > 0 && buffer[0].time < targetTime - 500) {
                        const oldFrame = buffer.shift();
                        oldFrame.img.close();
                    }

                    if (buffer.length > 0) {
                        let frameToDraw = null;
                        for (let i = buffer.length - 1; i >= 0; i--) {
                            if (buffer[i].time <= targetTime) {
                                frameToDraw = buffer[i];
                                break;
                            }
                        }

                        if (frameToDraw) {
                            ctx.drawImage(frameToDraw.img, 0, 0, outputCanvas.width, outputCanvas.height);
                            statusBadge.textContent = "⏱ " + delayRange.value + "秒前の映像";
                            statusBadge.style.background = "rgba(59, 130, 246, 0.8)";
                        } else {
                            ctx.fillStyle = "#111";
                            ctx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
                            const waited = (timestamp - buffer[0].time) / 1000;
                            const remain = Math.max(0, parseFloat(delayRange.value) - waited);
                            statusBadge.textContent = "あと" + remain.toFixed(1) + "秒で表示されます。";
                            statusBadge.style.background = "rgba(239, 68, 68, 0.8)";
                        }
                    }

                    requestAnimationFrame((t) => processFrame(t, myId));
                }).catch(e => {
                    console.error(e);
                    requestAnimationFrame((t) => processFrame(t, myId));
                });
            } else {
                requestAnimationFrame((t) => processFrame(t, myId));
            }
        }

        delayRange.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            delayDisplay.textContent = val.toFixed(1) + 's';
        });

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            isRunning = !isRunning;
            if (isRunning) {
                toggleIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
                toggleBtn.classList.replace('bg-green-600', 'bg-blue-600');
                statusBadge.style.display = "block";
                clearBuffer();
                startLoop();
            } else {
                toggleIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>';
                toggleBtn.classList.replace('bg-blue-600', 'bg-green-600');
                statusBadge.textContent = "⏸ 一時停止中(▶で再開)";
                statusBadge.style.background = "rgba(100, 116, 139, 0.9)";
            }
        });

        function clearBuffer() {
            buffer.forEach(f => f.img.close());
            buffer = [];
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
        }

        cameraBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (isSwitching) return;
            isSwitching = true;
            cameraBtn.disabled = true;
            cameraBtn.textContent = "切りかえ中…";

            const oldMode = facingMode;
            facingMode = facingMode === "environment" ? "user" : "environment";
            clearBuffer();

            const ok = await initCamera();
            if (!ok) {
                facingMode = oldMode;
                await initCamera();
            }
            updateCameraLabel();
            cameraBtn.disabled = false;
            isSwitching = false;
        });

        flipBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isFlipped = !isFlipped;
            outputCanvas.style.transform = isFlipped ? "scaleX(-1)" : "scaleX(1)";
        });

        container.addEventListener('click', () => {
            controls.classList.toggle('hidden');
        });
        window.onload = initCamera;
    </script>
</body>
</html>
