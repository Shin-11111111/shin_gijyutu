<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次元コードリーダー＆ジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
            background-color: #f7f9fb;
            min-height: 100dvh;
        }
        #video, #canvas {
            max-width: 100%;
            height: auto;
            border-radius: 0.75rem;
        }
        .highlight-box {
            position: absolute;
            border: 5px solid #10b981; /* emerald-500 */
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
        }
        #qrcodeContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px; 
            padding: 1rem;
            background-color: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        #qrcodeContainer canvas, #qrcodeContainer img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .tab-active {
            border-color: #10b981 !important;
            color: #10b981 !important;
        }
        .result-box {
            word-wrap: break-word;
            word-break: break-all;
            white-space: pre-wrap;
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 1rem;
            border-radius: 0.5rem;
        }
        .result-box.result-error {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="p-4 sm:p-6 md:p-8 min-h-screen flex flex-col">

    <div class="w-full max-w-6xl mx-auto flex flex-col flex-1">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">二次元コードリーダー＆ジェネレーター</h1>

        <div class="flex border-b border-gray-200 mb-6">
            <button id="tabReader" class="tab-button flex-1 py-2 px-4 text-center text-sm font-medium border-b-2 border-transparent hover:border-emerald-400 text-gray-600 transition duration-150 ease-in-out tab-active" data-tab="reader">
                リーダー（読み取り）
            </button>
            <button id="tabGenerator" class="tab-button flex-1 py-2 px-4 text-center text-sm font-medium border-b-2 border-transparent hover:border-emerald-400 text-gray-600 transition duration-150 ease-in-out" data-tab="generator">
                ジェネレーター（作成）
            </button>
        </div>

        <div id="readerView" class="tab-content flex flex-col flex-1">
            <div class="flex flex-col md:flex-row md:gap-6 flex-1">
                <div class="md:w-3/5 flex flex-col">
                    <div class="relative w-full bg-gray-900 rounded-xl shadow-xl overflow-hidden mb-4 flex-1" style="min-height: 14rem;">
                        <video id="video" class="w-full h-full object-contain" style="min-height: 14rem;" playsinline muted autoplay></video>
                        <canvas id="canvas" class="hidden w-full h-full object-contain" style="min-height: 14rem;"></canvas>
                        <div id="highlightContainer" class="absolute inset-0"></div>
                        <div id="videoOverlay" class="absolute inset-0 flex items-center justify-center bg-gray-900/50 transition-opacity duration-300">
                            <p class="text-white text-lg font-semibold" id="overlayMessage">カメラを起動するか、画像をアップロードしてください。</p>
                        </div>
                    </div>
                </div>

                <div class="md:w-2/5 flex flex-col gap-3">
                    <button id="startButton" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150 ease-in-out">
                        <span id="startStopText">カメラを起動</span>
                    </button>
                    <div class="flex rounded-lg overflow-hidden border border-gray-300 shadow-sm">
                        <button id="camBack" class="flex-1 bg-emerald-100 text-emerald-800 font-semibold py-2 px-3 text-sm transition duration-150 ease-in-out cam-select-active">外カメ</button>
                        <button id="camFront" class="flex-1 bg-white text-gray-600 font-semibold py-2 px-3 text-sm transition duration-150 ease-in-out">内カメ</button>
                    </div>
                    <button id="fileButton" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150 ease-in-out">
                        画像をアップロード
                    </button>
                    <button id="pasteButton" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150 ease-in-out">
                        クリップボード（コピーした画像）から貼り付け
                    </button>
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                    <div id="resultBox" class="result-box mt-2 flex-1" aria-live="polite">
                        ①「カメラを起動」を押す　②QRコードを画面に映す　③ここに結果が出ます
                    </div>
                </div>
            </div>
        </div>

        <div id="generatorView" class="tab-content hidden flex flex-col flex-1">
            <div class="flex flex-col md:flex-row md:gap-6 flex-1">
                <div class="md:w-1/2 bg-white p-6 rounded-xl shadow-xl flex flex-col">
                    <label for="qrText" class="block text-sm font-medium text-gray-700 mb-2">QRコードに含めるURLまたはテキスト:</label>
                    <textarea id="qrText" rows="6" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 mb-4 flex-1" placeholder="サイトのURL または テキスト"></textarea>
                    <p class="text-xs text-gray-500 mb-3">※ 長すぎると作成できません（英語は200文字、日本語は約70文字まで）</p>

                    <div class="flex flex-col gap-3">
                        <button id="generateQrBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150 ease-in-out">
                            QRコードを生成
                        </button>
                        <button id="downloadJpgBtn" disabled class="w-full bg-gray-400 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150 ease-in-out disabled:opacity-50" title="生成後にダウンロード可能になります">
                            JPEGでダウンロード
                        </button>
                        <p id="genMessage" class="text-sm font-semibold min-h-[1.5rem]" role="status"></p>
                    </div>
                </div>

                <!-- 右：QRコード表示 -->
                <div class="md:w-1/2 mt-4 md:mt-0">
                    <div id="qrcodeContainer" class="h-full" style="min-height: 250px;">
                        <p class="text-gray-500">生成ボタンを押すと、ここにQRコードが表示されます。</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultBox = document.getElementById('resultBox');
        const startButton = document.getElementById('startButton');
        const fileInput = document.getElementById('fileInput');
        const fileButton = document.getElementById('fileButton');
        const highlightContainer = document.getElementById('highlightContainer');
        const videoOverlay = document.getElementById('videoOverlay');
        const overlayMessage = document.getElementById('overlayMessage');
        const startStopText = document.getElementById('startStopText');

        const tabReader = document.getElementById('tabReader');
        const tabGenerator = document.getElementById('tabGenerator');
        const readerView = document.getElementById('readerView');
        const generatorView = document.getElementById('generatorView');

        const qrText = document.getElementById('qrText');
        const generateQrBtn = document.getElementById('generateQrBtn');
        const downloadJpgBtn = document.getElementById('downloadJpgBtn');
        const qrcodeContainer = document.getElementById('qrcodeContainer');
        const genMessage = document.getElementById('genMessage');

        function showGenMessage(text, isError = false) {
            genMessage.textContent = text;
            genMessage.className = 'text-sm font-semibold min-h-[1.5rem] ' +
                (isError ? 'text-red-600' : 'text-emerald-700');
        }
        
        let isCameraActive = false;
        let animationFrameId = null;
        let currentFacingMode = 'environment';

        const camBack = document.getElementById('camBack');
        const camFront = document.getElementById('camFront');

        camBack.addEventListener('click', () => {
            if (currentFacingMode === 'environment') return;
            currentFacingMode = 'environment';
            camBack.classList.add('bg-emerald-100', 'text-emerald-800');
            camBack.classList.remove('bg-white', 'text-gray-600');
            camFront.classList.add('bg-white', 'text-gray-600');
            camFront.classList.remove('bg-emerald-100', 'text-emerald-800');
            if (isCameraActive) { switchCamera(); }
        });

        camFront.addEventListener('click', () => {
            if (currentFacingMode === 'user') return;
            currentFacingMode = 'user';
            camFront.classList.add('bg-emerald-100', 'text-emerald-800');
            camFront.classList.remove('bg-white', 'text-gray-600');
            camBack.classList.add('bg-white', 'text-gray-600');
            camBack.classList.remove('bg-emerald-100', 'text-emerald-800');
            if (isCameraActive) { switchCamera(); }
        });

        const scanCanvas = document.createElement('canvas');
        const scanContext = scanCanvas.getContext('2d', { willReadFrequently: true });

        function displayResult(text, isError = false) {
            resultBox.textContent = text;
            resultBox.classList.toggle('result-error', isError);
        }

        function clearHighlight() {
            highlightContainer.innerHTML = '';
        }

        function scanLoop() {
            if (!isCameraActive) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                scanCanvas.width = video.videoWidth;
                scanCanvas.height = video.videoHeight;
                
                scanContext.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
                
                const imageData = scanContext.getImageData(0, 0, scanCanvas.width, scanCanvas.height);

                if (typeof jsQR !== 'undefined') {
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });

                    if (code) {
                        handleScanResult(code.data, code.location, true);
                        return;
                    } else {
                        clearHighlight();
                    }
                } else {
                    console.error("jsQRライブラリがロードされていません。");
                    stopCamera();
                    displayResult('スキャンライブラリの読み込みに失敗しました。', true);
                    return;
                }
            }

            animationFrameId = requestAnimationFrame(scanLoop);
        }

        async function getCameraStream(facingMode) {
            try {
                return await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: facingMode } },
                    audio: false
                });
            } catch (e) {
                if (!['OverconstrainedError', 'ConstraintNotSatisfiedError', 'NotFoundError'].includes(e.name)) {
                    throw e;
                }
            }

            try {
                const devices = (await navigator.mediaDevices.enumerateDevices())
                    .filter(d => d.kind === 'videoinput');
                if (devices.length >= 2) {
                    const backRe = /back|rear|environment|背面|外/i;
                    const frontRe = /front|user|face|前面|内/i;
                    let target;
                    if (facingMode === 'environment') {
                        target = devices.find(d => backRe.test(d.label)) || devices[devices.length - 1];
                    } else {
                        target = devices.find(d => frontRe.test(d.label)) || devices[0];
                    }
                    return await navigator.mediaDevices.getUserMedia({
                        video: { deviceId: { exact: target.deviceId } },
                        audio: false
                    });
                }
            } catch (e) {
                console.warn('デバイス指定での取得に失敗:', e);
            }

            return await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode },
                audio: false
            });
        }

        async function startCamera() {
            if (isCameraActive) {
                stopCamera();
                return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                displayResult('このページではカメラが使えません。「画像をアップロード」なら使えます。', true);
                return;
            }

            displayResult('カメラを起動中...');
            clearHighlight();
            video.classList.remove('hidden');
            canvas.classList.add('hidden');
            videoOverlay.classList.remove('hidden');
            overlayMessage.textContent = 'カメラを起動中...';
            startButton.disabled = true;

            try {
                const stream = await getCameraStream(currentFacingMode);
                video.srcObject = stream;
                video.setAttribute("playsinline", true);

                await new Promise((resolve) => {
                    if (video.readyState >= 1) {
                        resolve();
                    } else {
                        video.onloadedmetadata = () => resolve();
                    }
                });
                await video.play();
                
                isCameraActive = true;
                startButton.disabled = false;
                startStopText.textContent = 'スキャン中 (タップで停止)';
                startButton.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
                startButton.classList.add('bg-yellow-600', 'hover:bg-yellow-700');
                videoOverlay.classList.add('hidden');
                displayResult('カメラが起動しました。QRコードをかざしてください。');
                
                scanLoop(); 

            } catch (err) {
                isCameraActive = false;
                startButton.disabled = false;
                startButton.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
                startButton.classList.remove('bg-yellow-600', 'hover:bg-yellow-700');
                startStopText.textContent = 'カメラを起動';
                videoOverlay.classList.remove('hidden');
                
                let errorMessage = 'カメラの起動に失敗しました。';
                if (err.name === 'NotAllowedError') {
                    errorMessage = 'カメラへのアクセスが拒否されました。ブラウザのアドレスバー横にある🔒アイコンからカメラの許可を「許可」に変更してください。';
                } else if (err.name === 'NotFoundError') {
                    errorMessage = '利用可能なカメラが見つかりませんでした。';
                } else if (err.name === 'NotReadableError') {
                    errorMessage = 'カメラを使えませんでした。ほかのアプリがカメラを使っていないか確認してください。';
                }
                overlayMessage.textContent = 'カメラの起動に失敗しました。';
                displayResult(errorMessage, true);
                console.error('カメラ起動エラー:', err);
            }
        }

        async function switchCamera() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            isCameraActive = false;
            await new Promise(resolve => setTimeout(resolve, 300));
            await startCamera();
        }

        function stopCamera(silent = false) {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            isCameraActive = false;

            startStopText.textContent = 'カメラを起動';
            startButton.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
            startButton.classList.remove('bg-yellow-600', 'hover:bg-yellow-700');

            if (!silent) {
                videoOverlay.classList.remove('hidden');
                overlayMessage.textContent = 'カメラを起動するか、画像をアップロードしてください。';
                displayResult('スキャンを停止しました。');
                clearHighlight();
            }
        }

        function handleScanResult(data, location, isFromCamera = false) {
            if (isFromCamera) {
                canvas.width = scanCanvas.width;
                canvas.height = scanCanvas.height;
                canvas.getContext('2d').drawImage(scanCanvas, 0, 0);
                canvas.classList.remove('hidden');
                video.classList.add('hidden');
                stopCamera(true);
            }

            displayResult(`読み取り結果: ${data}`);

            if (location && location.topLeft) {
                const points = [
                    location.topLeft, location.topRight, location.bottomRight, location.bottomLeft,
                ];
                const minX = Math.min(...points.map(p => p.x));
                const minY = Math.min(...points.map(p => p.y));
                const maxX = Math.max(...points.map(p => p.x));
                const maxY = Math.max(...points.map(p => p.y));
                showHighlight(minX, minY, maxX, maxY, canvas);
            }

            if (/^https?:\/\//i.test(data)) {
                const note = document.createElement('p');
                note.className = 'mt-3 text-sm';
                note.textContent = '⚠️ 知らない人からもらったQRコードは、開く前に先生や家の人に確認しましょう。';

                const link = document.createElement('a');
                link.href = data;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = '🔗 このサイトを開く';
                link.className = 'mt-3 block text-center bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 px-4 rounded-lg';

                resultBox.append(note, link);
            }
        }

        fileButton.addEventListener('click', () => {
            if (isCameraActive) {
                stopCamera();
            }
            fileInput.click();
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            displayResult('ファイルをスキャン中...');
            clearHighlight();
            canvas.classList.remove('hidden');
            video.classList.add('hidden');
            videoOverlay.classList.add('hidden');
            startButton.classList.add('hidden'); 

            try {
                if (file.type === 'application/pdf') {
                    showEmptyViewer();
                    displayResult('PDFは読み取れません。PDFの中のQRコードを画像として保存してから、もう一度アップロードしてください。', true);
                    return;
                }
                
                if (typeof jsQR === 'undefined') {
                    throw new Error("jsQRライブラリがロードされていません。");
                }

                const img = new Image();
                const url = URL.createObjectURL(file);
                img.src = url;

                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                });
                
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    handleScanResult(code.data, code.location, false);
                } else {
                    displayResult('ファイルからQRコードを検出できませんでした。', true);
                }

                URL.revokeObjectURL(url);

            } catch (err) {
                let errorMessage = 'スキャン中にエラーが発生しました。ファイルが破損しているか、ライブラリの読み込みに問題があります。';
                showEmptyViewer();
                displayResult(errorMessage, true);
                console.error('ファイルスキャンエラー:', err);
            } finally {
                e.target.value = null;
                startButton.classList.remove('hidden');
            }
        });

        function showHighlight(minX, minY, maxX, maxY, element) {
            clearHighlight();

            const rect = element.getBoundingClientRect();
            const parentRect = highlightContainer.getBoundingClientRect();
            const naturalWidth = element.videoWidth || element.width;
            const naturalHeight = element.videoHeight || element.height;
            if (!naturalWidth || !naturalHeight) return;

            const scale = Math.min(rect.width / naturalWidth, rect.height / naturalHeight);
            const offsetX = (rect.left - parentRect.left) + (rect.width - naturalWidth * scale) / 2;
            const offsetY = (rect.top - parentRect.top) + (rect.height - naturalHeight * scale) / 2;

            const padding = 10;
            const left = (minX * scale) + offsetX - padding;
            const top = (minY * scale) + offsetY - padding;
            const width = ((maxX - minX) * scale) + (2 * padding);
            const height = ((maxY - minY) * scale) + (2 * padding);

            const highlight = document.createElement('div');
            highlight.classList.add('highlight-box');
            highlight.style.left = `${left}px`;
            highlight.style.top = `${top}px`;
            highlight.style.width = `${width}px`;
            highlight.style.height = `${height}px`;
            
            highlightContainer.appendChild(highlight);
        }

        generateQrBtn.addEventListener('click', () => {
            const text = qrText.value;
            if (!text) {
                showGenMessage('URLまたは文字を入力してください。', true);
                return;
            }

            try {
                if (typeof QRCode === 'undefined') {
                    throw new Error("QRCodeライブラリがロードされていません。");
                }
                
                qrcodeContainer.innerHTML = '';
                
                new QRCode(qrcodeContainer, {
                    text: text,
                    width: 256, 
                    height: 256,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.M 
                });
                
                downloadJpgBtn.disabled = false;
                downloadJpgBtn.classList.remove('bg-gray-400', 'disabled:opacity-50');
                downloadJpgBtn.classList.add('bg-purple-500', 'hover:bg-purple-600');
                showGenMessage('QRコードができました！ 「JPEGでダウンロード」ボタンで保存できます。');
                
            } catch(e) {
                console.error('QR生成に失敗しました:', e);
                qrcodeContainer.innerHTML = `<p class="text-red-500 p-4">QRコードの生成に失敗しました。入力内容が長すぎるか、ライブラリの読み込みに問題があります。</p>`;
                downloadJpgBtn.disabled = true;
                downloadJpgBtn.classList.add('bg-gray-400', 'disabled:opacity-50');
                downloadJpgBtn.classList.remove('bg-purple-500', 'hover:bg-purple-600');
                showGenMessage('QRコードを作成できませんでした。文字数が多すぎるかもしれません。短くしてもう一度試してください。', true);
            }
        });

        downloadJpgBtn.addEventListener('click', () => {
            const canvas = qrcodeContainer.querySelector('canvas');
            
            if (!canvas) {
                 showGenMessage('先にQRコードを作成してください。', true);
                 return;
            }

            const padding = 32;
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width + padding * 2;
            exportCanvas.height = canvas.height + padding * 2;
            const exportCtx = exportCanvas.getContext('2d');
            exportCtx.fillStyle = '#ffffff';
            exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            exportCtx.drawImage(canvas, padding, padding);
            const dataUrl = exportCanvas.toDataURL('image/jpeg', 0.92);
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `qr-code-${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        function switchTab(tabName) {
            if (tabName === 'reader') {
                readerView.classList.remove('hidden');
                generatorView.classList.add('hidden');
                tabReader.classList.add('tab-active');
                tabGenerator.classList.remove('tab-active');
                
                startButton.classList.remove('hidden');
                if (!isCameraActive) {
                    video.classList.remove('hidden');
                    canvas.classList.add('hidden');
                    videoOverlay.classList.remove('hidden');
                    overlayMessage.textContent = 'カメラを起動するか、画像をアップロードしてください。';
                    displayResult('①「カメラを起動」を押す　②QRコードを画面に映す　③ここに結果が出ます');
                }
            } else if (tabName === 'generator') {
                readerView.classList.add('hidden');
                generatorView.classList.remove('hidden');
                tabReader.classList.remove('tab-active');
                tabGenerator.classList.add('tab-active');

                if (isCameraActive) {
                    stopCamera();
                }
                startButton.classList.add('hidden'); 
            }
        }
        function showEmptyViewer() {
            canvas.classList.add('hidden');
            video.classList.remove('hidden');
            videoOverlay.classList.remove('hidden');
        }
        startButton.addEventListener('click', startCamera);
        tabReader.addEventListener('click', () => switchTab('reader'));
        tabGenerator.addEventListener('click', () => switchTab('generator'));

        document.getElementById('pasteButton').addEventListener('click', async () => {
            try {
                const clipboardItems = await navigator.clipboard.read();
                let imageBlob = null;
                for (const item of clipboardItems) {
                    const imageType = item.types.find(t => t.startsWith('image/'));
                    if (imageType) {
                        imageBlob = await item.getType(imageType);
                        break;
                    }
                }
                if (!imageBlob) {
                    displayResult('クリップボードに画像が見つかりません。', true);
                    return;
                }
                const file = new File([imageBlob], 'pasted.png', { type: imageBlob.type });
                if (isCameraActive) stopCamera();
                displayResult('クリップボードの画像をスキャン中...');
                clearHighlight();
                canvas.classList.remove('hidden');
                video.classList.add('hidden');
                videoOverlay.classList.add('hidden');
                startButton.classList.add('hidden');
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.src = url;
                await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    handleScanResult(code.data, code.location, false);
                } else {
                    displayResult('クリップボードの画像からQRコードを検出できませんでした。', true);
                }
                URL.revokeObjectURL(url);
                startButton.classList.remove('hidden');
            } catch (err) {
                displayResult('クリップボードへのアクセスに失敗しました。ブラウザの許可が必要です。', true);
                console.error('クリップボード貼り付けエラー:', err);
            }
        });

        window.addEventListener('resize', clearHighlight);
        
        window.onload = () => {
             switchTab('reader'); 
        };

        console.log("QR Code Reader & Generator Initialized.");

    </script>
</body>
</html>
