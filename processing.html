<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>材料と加工 工程ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#f1e7d1;
    --bg-panel:#fffbf2;
    --bg-panel-2:#f6ecd8;
    --ink:#2b2118;
    --ink-soft:#5b4d3c;
    --wood:#a9723d;
    --wood-dark:#6b4423;
    --wood-line:#c99a5e;
    --danger:#b8402e;
    --ruler-line: rgba(43,33,24,0.18);
    --radius: 8px;
    --shadow-card: 0 2px 0 rgba(43,33,24,0.06), 0 12px 26px -18px rgba(43,33,24,0.45);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg-base);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
    font-size:16px;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  a:focus-visible, button:focus-visible, .card-head:focus-visible{
    outline:3px solid var(--danger);
    outline-offset:3px;
  }

  /* ===== Header (compact) ===== */
  header.top{
    padding:20px 0 16px;
  }
  .school{
    margin:0 0 2px;
    font-size:13.5px;
    font-weight:700;
    color:var(--wood-dark);
  }
  h1.title{
    margin:0 0 6px;
    font-size:clamp(24px, 4vw, 30px);
    font-weight:900;
    line-height:1.35;
  }
  .lead{
    margin:0;
    font-size:15.5px;
    color:var(--ink-soft);
  }

  /* ===== Step navigation ===== */
  nav.rail{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(241,231,209,0.96);
    backdrop-filter:blur(6px);
    border-top:1px solid var(--ruler-line);
    border-bottom:1px solid var(--ruler-line);
  }
  .rail-inner{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:10px 24px;
    max-width:1080px;
    margin:0 auto;
    scrollbar-width:thin;
  }
  .rail-item{
    flex:1 0 auto;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:6px 14px;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    text-decoration:none;
    white-space:nowrap;
    background:var(--bg-panel);
    border:1px solid var(--ruler-line);
    border-radius:var(--radius);
    transition:background .15s, color .15s;
  }
  .rail-item .n{
    width:24px; height:24px;
    border-radius:50%;
    display:grid; place-items:center;
    font-size:13px; font-weight:900;
    color:#fff;
    background:var(--wood-dark);
  }
  .rail-item:hover{ background:var(--bg-panel-2); }
  .rail-item.active{ background:var(--wood-dark); color:#fff; border-color:var(--wood-dark); }
  .rail-item.active .n{ background:#fff; color:var(--wood-dark); }

  /* ===== Cards ===== */
  main{ padding:24px 0 48px; }
  .process-list{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card{
    position:relative;
    background:var(--bg-panel);
    border:1px solid var(--ruler-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:6px;
    background:var(--wood-line);
    transition:background .2s;
  }
  .card[data-open="true"]::before{ background:var(--danger); }

  .card-head{
    all:unset;
    box-sizing:border-box;
    display:grid;
    grid-template-columns:48px 1fr auto;
    align-items:center;
    gap:16px;
    width:100%;
    padding:18px 20px 18px 26px;
    cursor:pointer;
  }
  .card-num{
    width:48px; height:48px;
    border-radius:10px;
    display:grid; place-items:center;
    font-size:24px; font-weight:900;
    color:#fff;
    background:var(--wood-dark);
    transition:background .2s;
  }
  .card[data-open="true"] .card-num{ background:var(--danger); }
  .card-name{ display:flex; flex-direction:column; gap:0; }
  .card-name .jp{ font-size:22px; font-weight:900; line-height:1.4; }
  .card-name .glance{ font-size:14.5px; color:var(--ink-soft); }

  .card-toggle{
    display:inline-flex;
    align-items:center;
    min-height:38px;
    padding:4px 16px;
    font-size:14.5px;
    font-weight:700;
    color:var(--wood-dark);
    border:2px solid var(--wood-dark);
    border-radius:999px;
    white-space:nowrap;
    transition:background .2s, color .2s;
  }
  .card-toggle .t-close{ display:none; }
  .card[data-open="true"] .card-toggle{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .card[data-open="true"] .t-open{ display:none; }
  .card[data-open="true"] .t-close{ display:inline; }

  .card-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s ease;
  }
  .card-body-inner{ overflow:hidden; }
  .card[data-open="true"] .card-body{ grid-template-rows:1fr; }

  .card-content{
    display:grid;
    grid-template-columns:1fr 1.2fr;
    gap:28px;
    margin:0 0 0;
    padding:24px 26px 28px 28px;
    border-top:1px dashed var(--ruler-line);
  }

  .content-block h4,
  .safety-box h4,
  .video-block h4{
    margin:0 0 12px;
    font-size:17px;
    font-weight:900;
    line-height:1.4;
    padding-left:10px;
    border-left:5px solid var(--wood);
  }

  /* tools */
  .tool-list{
    list-style:none; margin:0; padding:0;
    display:flex; flex-direction:column; gap:8px;
  }
  .tool-list li{
    background:var(--bg-panel-2);
    border:1px solid var(--ruler-line);
    border-radius:var(--radius);
    padding:7px 12px;
    line-height:1.5;
  }
  .tool-list .tn{ display:block; font-size:15.5px; font-weight:700; }
  .tool-list .tnote{ display:block; font-size:13.5px; color:var(--ink-soft); }

  /* steps */
  .step-list{
    list-style:none; margin:0; padding:0;
    counter-reset:sub;
    display:flex; flex-direction:column; gap:12px;
  }
  .step-list li{
    counter-increment:sub;
    display:grid;
    grid-template-columns:28px 1fr;
    gap:12px;
    font-size:16px;
    line-height:1.7;
  }
  .step-list li::before{
    content:counter(sub);
    font-size:14px;
    font-weight:900;
    color:#fff;
    background:var(--wood);
    width:28px; height:28px;
    border-radius:50%;
    display:grid; place-items:center;
  }

  /* safety */
  .safety-box{
    grid-column:1 / -1;
    background:#fbeeea;
    border:2px solid #e0a999;
    border-radius:var(--radius);
    padding:16px 20px;
    display:flex;
    gap:14px;
  }
  .safety-icon{ flex-shrink:0; width:26px; height:26px; margin-top:2px; }
  .safety-icon svg{ width:26px; height:26px; }
  .safety-box h4{ color:var(--danger); border-left-color:var(--danger); }
  .safety-box ul{
    margin:0; padding-left:20px;
    font-size:15.5px; color:#4e2219;
    display:flex; flex-direction:column; gap:6px;
  }

  /* video */
  .video-block{ grid-column:1 / -1; }
  .video-hint{ font-size:14px; color:var(--ink-soft); }
  .video-player{
    width:100%;
    border-radius:var(--radius);
    overflow:hidden;
    background:#111;
    box-shadow:var(--shadow-card);
  }
  .video-player video{
    display:block;
    width:100%;
    max-height:420px;
    background:#000;
  }

  /* next step */
  .next-row{
    grid-column:1 / -1;
    display:flex;
    justify-content:flex-end;
  }
  .next-btn{
    font-family:inherit;
    font-size:15.5px;
    font-weight:700;
    min-height:44px;
    padding:8px 20px;
    color:#fff;
    background:var(--wood-dark);
    border:none;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s;
  }
  .next-btn:hover{ background:var(--ink); }
  .done-msg{ font-size:15.5px; font-weight:700; color:var(--wood-dark); margin:0; }

  @media (max-width: 760px){
    .wrap{ padding:0 16px; }
    .rail-inner{ padding:8px 16px; }
    .card-head{
      grid-template-columns:42px 1fr auto;
      gap:12px;
      padding:14px 14px 14px 20px;
    }
    .card-num{ width:42px; height:42px; font-size:21px; }
    .card-name .jp{ font-size:19px; }
    .card-toggle{ padding:4px 12px; font-size:13.5px; }
    .card-content{ grid-template-columns:1fr; padding:20px 18px 24px; gap:24px; }
    .next-row{ justify-content:stretch; }
    .next-btn{ width:100%; }
  }

  footer{
    border-top:1px solid var(--ruler-line);
    padding:28px 0 48px;
    color:var(--ink-soft);
    font-size:14px;
  }
  footer .wrap{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .card-body, .card-toggle, .next-btn, .rail-item{ transition:none; }
  }

  /* 画像の拡大 */
  .zoom-trigger{
    position:relative;
    display:block;
    width:100%;
    padding:0;
    border:0;
    background:none;
    cursor:zoom-in;
  }
  .zoom-trigger img{
    display:block;
    width:100%;
    max-height:420px;
    object-fit:contain;
  }
  .zoom-badge{
    position:absolute;
    right:10px;
    bottom:10px;
    padding:4px 12px;
    border-radius:999px;
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:13px;
    pointer-events:none;
  }
  .lightbox{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:rgba(0,0,0,.92);
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:contain;
  }
  .lightbox[data-open="true"]{ display:flex; }
  .lightbox img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:8px;
    transform-origin:center center;
    will-change:transform;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
    touch-action:none;
  }
  .lightbox[data-dragging="true"] img{ cursor:grabbing; }
  .lightbox-close{
    position:absolute;
    top:12px;
    right:12px;
    padding:8px 16px;
    border:0;
    border-radius:999px;
    background:#fff;
    color:#111;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .lightbox-tools{
    position:absolute;
    left:50%;
    bottom:16px;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    border-radius:999px;
    background:rgba(0,0,0,.55);
  }
  .lightbox-tools button{
    min-width:44px;
    height:44px;
    padding:0 14px;
    border:0;
    border-radius:999px;
    background:#fff;
    color:#111;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
</style>
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <p class="school">久保田の技術部屋 ｜ 材料と加工の技術</p>
    <h1 class="title">材料と加工 工程ガイド</h1>
    <p class="lead">
      木の作品づくりは、7つの工程で進めます。
      下のボタンから、いま取り組む工程をえらぼう。道具・作業の順番・安全の注意が見られます。
    </p>
  </div>
</header>

<nav class="rail" aria-label="工程ジャンプメニュー">
  <div class="rail-inner" id="railInner">
    <!-- filled by JS -->
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="process-list" id="processList"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>技術科 材料と加工の技術</span>
    <span>安全第一・品質第二・生産第三。こまったときは、すぐ先生に相談しよう。</span>
  </div>
</footer>
<div class="lightbox" id="lightbox" data-open="false" data-dragging="false" role="dialog" aria-modal="true" aria-label="画像の拡大表示">
  <button type="button" class="lightbox-close">× とじる</button>
  <img id="lightboxImg" alt="" draggable="false" oncontextmenu="return false">
  <div class="lightbox-tools">
    <button type="button" data-zoom="out" aria-label="縮小">－</button>
    <button type="button" data-zoom="reset" aria-label="元の大きさに戻す">元に戻す</button>
    <button type="button" data-zoom="in" aria-label="拡大">＋</button>
  </div>
</div>
<script>
  // ------------------------------------------------------------------
  // 工程データ
  // tools: [道具の名前, 説明(なくてもよい)]
  // videoUrl: 動画のURL。空文字("")なら「参考動画はありません」と表示される。
  // ------------------------------------------------------------------

    {
      jp: "設計",
      glance: "どんなものを作るか、アイデアを形にする",
      tools: [
        ["パソコン(CAD)", "図をかくためのソフト"],

      ],
      steps: [
        "何のために、だれが使うものかを考える",

        "切りやすさや、材料の手に入れやすさも考えて形を決める"
      ],
      safety: [
        "パソコンを使うときは、よい姿勢で、画面に目を近づけすぎない"
      ],
      videoUrl: "https://raw.githubusercontent.com/Shin-11111111/shin_gijyutu/main/video/design.png"
    },
    {
      jp: "製図",
      glance: "長さを入れた、正確な図面をかく",
      tools: [
        ["パソコン(CAD)", "図をかくためのソフト"],
        ["等角図方眼紙", "立体的な図をかくための方眼紙"],
        ["鉛筆・消しゴム"],
        ["定規"]
      ],
      steps: [
        "パソコンのCADで作った図を見ながら、等角図（立体的な図）をかく",
        "各部分の長さ（寸法）を、正確に書き込む",
        "材料取り図（板のどこから、どの部品を切り出すかを示した図）を作る",
        "等角図と材料取り図を見くらべて、同じ板には同じ番号をふる"
      ],
      safety: [
        "机の上をかたづけて、ていねいにかく",
        "さしがねで遊ばない（金属でできていて、けがをするおそれがある）"
      ],
      videoUrl: "https://raw.githubusercontent.com/Shin-11111111/shin_gijyutu/main/video/drafting.jpg"
    },
    {
      jp: "けがき",
      glance: "材料に、切る線や仕上がりの線を引く",
      tools: [
        ["木材"],
        ["さしがね", "L字形の金属の定規。長さを測ったり、直角の線を引いたりする"],
        ["鉛筆・消しゴム"],
        ["作った材料取り図"]

      steps: [

        "1か所を切るために、「切断線」と「仕上がり寸法線」をあわせて3本の線を正確にかく",
        "かいた線が図面と合っているか、見くらべて確かめる"
      ],
      safety: [
        "作業台の上をかたづけて、材料が動かないようにしてから作業する"
      ],
      videoUrl: "https://raw.githubusercontent.com/Shin-11111111/shin_gijyutu/main/video/marking.mp4"
    },
    {
      jp: "切断",
      glance: "のこぎりで材料を切る",
      tools: [
        ["木材"],
        ["のこぎり"],
        ["万力", "材料をはさんで、動かないように固定する道具"],

      steps: [

      ],
      safety: [
        "金やすり・ドレッサー・研磨紙が進む方向に、材料を支える手を置かない",

      ],
      videoUrl: "https://raw.githubusercontent.com/Shin-11111111/shin_gijyutu/main/video/shaping.mp4"

    {

        ["作った材料取り図"],
        ["げんのう", "くぎを打つ金づち"],
        ["くぎ締め", "くぎの頭を、木の中まで打ち込むための棒"],
        ["くぎ"],
        ["きり", "くぎを打つ前に、下穴（くぎの通り道）をあける道具"],
        ["木工用ボンド"],
        ["垂直クランプ", "部品を直角に合わせて、固定する道具"],
        ["濡れ雑巾", "はみ出たボンドを拭き取るもの"],
        ["パテ・ヘラ", "くぎ穴やすき間を、うめる材料"],
        ["バール(くぎ抜き)・あて木", "打ちまちがえたくぎを抜く道具"]
      ],
      steps: [

        "くぎを打つ",
        "最後は、くぎ締めを使って、くぎを最後まで打ち込む",
        "はみ出したボンドは、濡れ雑巾でふき取る"
      ],
      safety: [
        "げんのうを使うときは、まわりに人がいないか確認する",
        "くぎを打つ手と、支える手の位置に、十分気をつける",
        "打ち込み終わる前に、横からくぎが飛び出していないか確認する",
        "バール(くぎ抜き)を使うときは、てこの原理を使う（まっすぐ上に引き抜かない）"
      ],
      videoUrl: "https://raw.githubusercontent.com/Shin-11111111/shin_gijyutu/main/video/assembly.mp4"
    },
    {
      jp: "仕上げ",
      glance: "ニスを塗って、完成させる",
      tools: [
        ["組み立てた作品"],
        ["ニス", "木を守り、つやを出す塗料"],
        ["ハケ"],
        ["容器"],
        ["新聞紙"],
        ["よごれてもいい服装"]
      ],
      steps: [
        "必要な量のニスを、容器に出す",
        "新聞紙をしいて、よごれてもいい服装で作業する",
        "ハケで、むらなく・うすく塗る",
        "2～3回、くり返して塗る",
        "容器に残ったニスは、新聞紙にしみ込ませて捨てる",
        "ハケはきれいに洗って、乾かす"
      ],
      safety: [
        "ニスは、必ず換気のよい場所で使う",
        "ニスが皮膚についたら、すぐ洗い流す"
      ],
      videoUrl: ""
    }
  ];

  const railInner = document.getElementById('railInner');
  const processList = document.getElementById('processList');

  const alertSvg = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3L22 20H2L12 3Z" stroke="#b8402e" stroke-width="1.8" stroke-linejoin="round"/><line x1="12" y1="9" x2="12" y2="14" stroke="#b8402e" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="#b8402e"/></svg>`;

  PROCESS_DATA.forEach((p, i) => {
    const num = i + 1;
    const id = `step-${num}`;
    const next = PROCESS_DATA[i + 1];

    const railA = document.createElement('a');
    railA.href = `#${id}`;
    railA.className = 'rail-item';
    railA.dataset.target = id;
    railA.innerHTML = `<span class="n">${num}</span><span>${p.jp}</span>`;
    railA.addEventListener('click', (e) => {
      e.preventDefault();
      scrollToCard(id);
    });
    railInner.appendChild(railA);

    const card = document.createElement('article');
    card.className = 'card';
    card.id = id;
    card.dataset.open = 'false';

    const toolsHtml = p.tools.map(([name, note]) =>
      `<li><span class="tn">${name}</span>${note ? `<span class="tnote">${note}</span>` : ''}</li>`
    ).join('');
    const stepsHtml = p.steps.map(s => `<li>${s}</li>`).join('');
    const safetyHtml = p.safety.map(s => `<li>${s}</li>`).join('');

    const isImage = /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(p.videoUrl || '');

    const videoInner = !p.videoUrl
      ? `<span class="video-hint">この工程の参考動画はありません</span>`
      : isImage
        ? `<div class="video-player">
             <button type="button" class="zoom-trigger" aria-label="${p.jp}の参考画像を拡大する">
               <img src="${p.videoUrl}" alt="${p.jp}の参考画像" oncontextmenu="return false">
               <span class="zoom-badge">🔍 タップで拡大</span>
             </button>
           </div>`
        : `<div class="video-player">
             <video controls autoplay muted loop playsinline preload="metadata" controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false" src="${p.videoUrl}"></video>
           </div>`;

    const nextHtml = next
      ? `<button type="button" class="next-btn" data-next="step-${num + 1}">次の工程：${next.jp} を見る</button>`
      : `<p class="done-msg">これで全部の工程が終了です。おつかれさまでした！</p>`;

    card.innerHTML = `
      <button class="card-head" aria-expanded="false" aria-controls="${id}-body">
        <span class="card-num">${num}</span>
        <span class="card-name">
          <span class="jp">${p.jp}</span>
          <span class="glance">${p.glance}</span>
        </span>
        <span class="card-toggle" aria-hidden="true"><span class="t-open">＋ ひらく</span><span class="t-close">－ とじる</span></span>
      </button>
      <div class="card-body" id="${id}-body">
        <div class="card-body-inner">
          <div class="card-content">
            <div class="content-block">
              <h4>使う道具</h4>
              <ul class="tool-list">${toolsHtml}</ul>
            </div>
            <div class="content-block">
              <h4>作業の順番</h4>
              <ol class="step-list">${stepsHtml}</ol>
            </div>
            <div class="safety-box">
              <span class="safety-icon">${alertSvg}</span>
              <div>
                <h4>安全のために気をつけること</h4>
                <ul>${safetyHtml}</ul>
              </div>
            </div>
            <div class="video-block">
              <h4>参考動画・画像</h4>
              ${videoInner}
            </div>
            <div class="next-row">${nextHtml}</div>
          </div>
        </div>
      </div>
    `;
    processList.appendChild(card);

    const head = card.querySelector('.card-head');
    head.addEventListener('click', () => {
      const isOpen = card.dataset.open === 'true';
      card.dataset.open = isOpen ? 'false' : 'true';
      head.setAttribute('aria-expanded', String(!isOpen));
    });

    const nextBtn = card.querySelector('.next-btn');
    if (nextBtn) {
      nextBtn.addEventListener('click', () => scrollToCard(nextBtn.dataset.next));
    }
  });

  const railItems = Array.from(document.querySelectorAll('.rail-item'));
  const cards = Array.from(document.querySelectorAll('.card'));
  const railNav = document.querySelector('nav.rail');

  function openCard(card) {
    if (card.dataset.open === 'true') return;
    card.dataset.open = 'true';
    card.querySelector('.card-head').setAttribute('aria-expanded', 'true');
  }

  function scrollToCard(id) {
    const target = document.getElementById(id);
    if (!target) return;

    const doScroll = () => {
      const navHeight = railNav.getBoundingClientRect().height;
      const targetTop = target.getBoundingClientRect().top + window.pageYOffset;
      window.scrollTo({ top: targetTop - navHeight - 16, behavior: 'smooth' });
    };

    const wasAlreadyOpen = target.dataset.open === 'true';
    openCard(target);

    if (wasAlreadyOpen) {
      doScroll();
      return;
    }

    const body = target.querySelector('.card-body');
    let settled = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      body.removeEventListener('transitionend', onTransitionEnd);
      doScroll();
    };
    const onTransitionEnd = (e) => {
      if (e.target === body) finish();
    };
    body.addEventListener('transitionend', onTransitionEnd);
    setTimeout(finish, 360);
  }

  let ticking = false;
  function updateActiveCard() {
    const activationLine = railNav.getBoundingClientRect().bottom + 24;

    let current = cards[0];
    for (const card of cards) {
      if (card.getBoundingClientRect().top <= activationLine) {
        current = card;
      } else {
        break;
      }
    }

    railItems.forEach(r => r.classList.remove('active'));
    const link = railItems.find(r => r.dataset.target === current.id);
    if (link) {
      link.classList.add('active');
      const railRect = railInner.getBoundingClientRect();
      const linkRect = link.getBoundingClientRect();
      if (linkRect.left < railRect.left || linkRect.right > railRect.right) {
        link.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      }
    }
    ticking = false;
  }

  function onScrollOrResize() {
    if (!ticking) {
      requestAnimationFrame(updateActiveCard);
      ticking = true;
    }
  }

  window.addEventListener('scroll', onScrollOrResize, { passive: true });
  window.addEventListener('resize', onScrollOrResize);

  cards.forEach(card => {
    card.querySelector('.card-head').addEventListener('click', () => {
      setTimeout(updateActiveCard, 340);
    });
  });

  updateActiveCard();

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const MIN_SCALE = 1;
  const MAX_SCALE = 6;
  let zScale = 1, zX = 0, zY = 0;

  function applyZoom() {
    lightboxImg.style.transform = `translate(${zX}px, ${zY}px) scale(${zScale})`;
  }

  function clampPan() {
    const maxX = Math.max(0, (lightboxImg.offsetWidth * zScale - lightbox.clientWidth) / 2);
    const maxY = Math.max(0, (lightboxImg.offsetHeight * zScale - lightbox.clientHeight) / 2);
    zX = Math.min(maxX, Math.max(-maxX, zX));
    zY = Math.min(maxY, Math.max(-maxY, zY));
  }

  function zoomAt(px, py, newScale) {
    newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
    const r = lightbox.getBoundingClientRect();
    const dx = px - (r.left + r.width / 2);
    const dy = py - (r.top + r.height / 2);
    const k = newScale / zScale;
    zX = dx - (dx - zX) * k;
    zY = dy - (dy - zY) * k;
    zScale = newScale;
    clampPan();
    applyZoom();
  }

  function zoomAtCenter(factor) {
    const r = lightbox.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, zScale * factor);
  }

  function resetZoom() {
    zScale = 1; zX = 0; zY = 0;
    applyZoom();
  }

  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    resetZoom();
    lightbox.dataset.open = 'true';
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    pointers.clear();
    tapStart = null;
    lightbox.dataset.open = 'false';
    lightbox.dataset.dragging = 'false';
    lightboxImg.removeAttribute('src');
    document.body.style.overflow = '';
    resetZoom();
  }

  document.addEventListener('click', (e) => {
    const trigger = e.target.closest('.zoom-trigger');
    if (!trigger) return;
    const img = trigger.querySelector('img');
    openLightbox(img.src, img.alt);
  });

  const pointers = new Map();
  let lastDist = 0;
  let lastMid = { x: 0, y: 0 };
  let tapStart = null;
  let lastTap = { time: 0, x: 0, y: 0 };

  function pinchInfo() {
    const [a, b] = Array.from(pointers.values());
    return { dist: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }

  lightbox.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    lightbox.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      tapStart = { x: e.clientX, y: e.clientY, onBackdrop: e.target === lightbox, moved: false };
    } else {
      tapStart = null;
      const p = pinchInfo();
      lastDist = p.dist;
      lastMid = { x: p.x, y: p.y };
    }
    lightbox.dataset.dragging = 'true';
  });

  lightbox.addEventListener('pointermove', (e) => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const cur = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, cur);

    if (pointers.size >= 2) {
      const p = pinchInfo();
      if (lastDist > 0) zoomAt(p.x, p.y, zScale * (p.dist / lastDist));
      zX += p.x - lastMid.x;
      zY += p.y - lastMid.y;
      clampPan();
      applyZoom();
      lastDist = p.dist;
      lastMid = { x: p.x, y: p.y };
    } else {
      zX += cur.x - prev.x;
      zY += cur.y - prev.y;
      clampPan();
      applyZoom();
      if (tapStart && Math.hypot(cur.x - tapStart.x, cur.y - tapStart.y) > 8) tapStart.moved = true;
    }
  });

  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size > 0) return;

    lightbox.dataset.dragging = 'false';
    if (e.type === 'pointerup' && tapStart && !tapStart.moved) {
      if (tapStart.onBackdrop) {
        closeLightbox();
        return;
      }
      const now = Date.now();
      if (now - lastTap.time < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
        if (zScale > 1.01) resetZoom();
        else zoomAt(e.clientX, e.clientY, 2.5);
        lastTap.time = 0;
      } else {
        lastTap = { time: now, x: e.clientX, y: e.clientY };
      }
    }
    tapStart = null;
  }
  lightbox.addEventListener('pointerup', endPointer);
  lightbox.addEventListener('pointercancel', endPointer);

  lightbox.addEventListener('wheel', (e) => {
    e.preventDefault();
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 33;
    zoomAt(e.clientX, e.clientY, zScale * Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)));
  }, { passive: false });

  lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
  lightbox.querySelector('[data-zoom="in"]').addEventListener('click', () => zoomAtCenter(1.5));
  lightbox.querySelector('[data-zoom="out"]').addEventListener('click', () => zoomAtCenter(1 / 1.5));
  lightbox.querySelector('[data-zoom="reset"]').addEventListener('click', resetZoom);

  document.addEventListener('keydown', (e) => {
    if (lightbox.dataset.open !== 'true') return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === '+' || e.key === '=') zoomAtCenter(1.5);
    else if (e.key === '-') zoomAtCenter(1 / 1.5);
    else if (e.key === '0') resetZoom();
  });

  window.addEventListener('resize', () => {
    if (lightbox.dataset.open === 'true') { clampPan(); applyZoom(); }
  });
</script>
</body>
</html>
